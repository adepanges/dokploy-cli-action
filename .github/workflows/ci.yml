name: CI
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundled CLI runs and matches package.json
        run: test "$(node dist/cli/cli.mjs --version)" = "$(node -p "require('@dokploy/cli/package.json').version")"
