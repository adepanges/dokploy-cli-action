name: Release
# dist/ is never committed to a branch: each release tag is a commit that adds it, so a
# Dependabot bump of @dokploy/cli ships as soon as it is merged and released.
# Version = bundled CLI version + build number: v0.30.7-1, v0.30.7-2, … then v0.30.8-1.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false # dependency scripts must not find a write token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundled CLI runs and matches package.json
        run: test "$(node dist/cli/cli.mjs --version)" = "$(node -p "require('@dokploy/cli/package.json').version")"
      - name: Next version
        id: version
        run: |
          git fetch --tags
          CLI=$(node -p "require('@dokploy/cli/package.json').version")
          LAST=$(git tag -l "v$CLI-*" | sed "s/^v$CLI-//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"
          echo "version=$CLI-$(( ${LAST:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Tag a commit with dist/ and move v<cli> and v<major>
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLI: ${{ steps.version.outputs.cli }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach
          npm pkg set version="$VERSION"
          git add -f dist package.json
          git commit -m "release v$VERSION"
          git tag "v$VERSION"
          git tag -f "v$CLI"
          git tag -f "v${CLI%%.*}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" "v$VERSION"
          git push -f "$REMOTE" "v$CLI" "v${CLI%%.*}"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION (@dokploy/cli $CLI)"
