name: Release
# Runs when a release/vX.Y.Z PR is merged into master: builds dist/ into a tag commit (dist/ is never
# committed to a branch), tags vX.Y.Z, moves the floating tag, publishes a GitHub release whose notes
# are the PR body (the changeset), and deletes the release branch.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Version from the branch
        id: version
        env:
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${REF#release/v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad release branch $REF"; exit 1; }
          IFS=. read -r MA MI _ <<< "$VERSION"
          # 0.x: minors may break, so the floating tag is v0.<minor>; from 1.0 it is v<major>
          [ "$MA" = 0 ] && FLOAT="v0.$MI" || FLOAT="v$MA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "float=$FLOAT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false # dependency scripts must not find a write token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundled CLI runs and matches package.json
        run: test "$(node dist/cli/cli.mjs --version)" = "$(node -p "require('@dokploy/cli/package.json').version")"
      - name: Tag, release, delete the branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLOAT: ${{ steps.version.outputs.float }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NOTES: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code --tags "$REMOTE" "refs/tags/v$VERSION" >/dev/null && { echo "::error::v$VERSION exists"; exit 1; }
          git switch --detach
          npm pkg set version="$VERSION"
          git add -f dist package.json
          git commit -m "release v$VERSION"
          git tag "v$VERSION"
          git tag -f "$FLOAT"
          git push "$REMOTE" "v$VERSION"
          git push -f "$REMOTE" "$FLOAT"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          git push "$REMOTE" --delete "$BRANCH"
