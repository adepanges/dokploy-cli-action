name: Release
# Runs when a release/vX.Y.Z PR is merged into master. It installs and builds nothing: it takes the
# dist/ that release-build.yml built and attested for the PR's head commit, puts it in a tag commit
# (dist/ is never committed to a branch), tags vX.Y.Z, moves the floating tag, publishes a GitHub release whose notes
# are the PR body (the changeset), deletes the release branch and merges master back into develop.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, the GitHub release, the back-merge into develop
      actions: read # the release build's artifact
      attestations: read
    steps:
      - name: Version from the branch
        id: version
        env:
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${REF#release/v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad release branch $REF"; exit 1; }
          IFS=. read -r MA MI _ <<< "$VERSION"
          # 0.x: minors may break, so the floating tag is v0.<minor>; from 1.0 it is v<major>
          [ "$MA" = 0 ] && FLOAT="v0.$MI" || FLOAT="v$MA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "float=$FLOAT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the release build of the PR head
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=release-$SHA" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          [ -n "$RUN" ] || { echo "::error::no release build for $SHA: re-run Release build on the branch, or Prepare release"; exit 1; }
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.event.pull_request.head.sha }}
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
      - name: Verify the attestations, then use that dist/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/index.js dist/cli/cli.mjs; do
            gh attestation verify "$RUNNER_TEMP/release/$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml"
          done
          rm -rf dist && cp -r "$RUNNER_TEMP/release/dist" dist
      - name: Tag, release, delete the branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLOAT: ${{ steps.version.outputs.float }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NOTES: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code --tags "$REMOTE" "refs/tags/v$VERSION" >/dev/null && { echo "::error::v$VERSION exists"; exit 1; }
          git switch --detach
          git add -f dist
          git commit -m "release v$VERSION"
          git tag "v$VERSION"
          git tag -f "$FLOAT"
          git push "$REMOTE" "v$VERSION"
          git push -f "$REMOTE" "$FLOAT"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$RUNNER_TEMP"/release/dokploy-cli-action.* --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          git push "$REMOTE" --delete "$BRANCH"
      - name: Merge master back into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$REMOTE" master:refs/remotes/up/master develop:refs/remotes/up/develop
          git switch -C develop up/develop
          git merge --no-edit up/master || { echo "::error::merge master into develop by hand"; exit 1; }
          git push "$REMOTE" develop
